// MX Master 4 설정 (logiops)
// 적용: sudo systemctl restart logid
// 장치 이름 확인: sudo logid -v (아래 name과 다르면 수정)

// 블루투스 연결 직후 응답 지연으로 장치 추가에 실패하는 문제 방지
io_timeout: 60000;

devices: ({
  name: "MX Master 4";

  // 감도 (200 ~ 8000)
  dpi: 2200;

  // 휠 자동 프리스핀 전환. threshold가 낮을수록 쉽게 풀림 (1~255)
  smartshift: { on: true; threshold: 15; };

  // 고해상도 스크롤
  hiresscroll: { hires: true; invert: false; target: false; };

  // 엄지 가로휠
  thumbwheel: { divert: false; invert: false; };

  buttons: (
    // 뒤로 / 앞으로 (기본 동작 유지)
    { cid: 0x53; action = { type: "Keypress"; keys: ["KEY_BACK"]; }; },
    { cid: 0x56; action = { type: "Keypress"; keys: ["KEY_FORWARD"]; }; },

    // 휠 위 상단 버튼: SmartShift 토글
    { cid: 0xc4; action = { type: "ToggleSmartShift"; }; },

    // 엄지 제스처 버튼(썸휠 아래, 뒤로가기 옆): 화면 캡처 (Super+A)
    { cid: 0xc3; action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_A"]; }; },

    // 엄지 햅틱 패널(Actions Ring): Alt+좌클릭
    // 누르고 있는 동안 유지되므로 홀드+드래그 → Hyprland 창 이동
    { cid: 0x1a0; action = { type: "Keypress"; keys: ["KEY_LEFTALT", "BTN_LEFT"]; }; }
  );
});
