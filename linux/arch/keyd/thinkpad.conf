# /etc/keyd/thinkpad.conf
[ids]
# ids 확인 필요
0001:0001

[main]
rightalt = f9
sysrq = layer(altgr)
capslock = layer(capslock)

# Swap Alt <-> Control
leftalt = layer(control)
leftcontrol = layer(alt)
leftmeta = layer(alt)
rightcontrol = rightmeta

[capslock]
a = left
s = down
w = up
d = right
h = home
l = end
j = backspace
k = delete

[control]

[alt]

[altgr]

[control+shift]

# app.conf에서 meta+control+shift 조합을 앱별로 덮어쓰기 위한 빈 composite 레이어
[meta+control+shift]
